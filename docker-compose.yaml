services:
  postgres:
    image: postgres:17-alpine
    container_name: order-service-postgres
    environment:
      POSTGRES_DB: ${ORDER_SERVICE_DB_NAME}
      POSTGRES_USER: ${ORDER_SERVICE_DB_USER}
      POSTGRES_PASSWORD: ${ORDER_SERVICE_DB_PASSWORD:?Set ORDER_SERVICE_DB_PASSWORD in .env}
    ports:
      - "127.0.0.1:${ORDER_SERVICE_DB_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}" ]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  order-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: order-service
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SERVER_PORT: 8080
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${ORDER_SERVICE_DB_NAME}
      SPRING_DATASOURCE_USERNAME: ${ORDER_SERVICE_DB_USER}
      SPRING_DATASOURCE_PASSWORD: ${ORDER_SERVICE_DB_PASSWORD:?Set ORDER_SERVICE_DB_PASSWORD in .env}
      JWT_PUBLIC_KEY_PATH: ${JWT_PUBLIC_KEY_PATH}
      USER_SERVICE_URL: ${USER_SERVICE_URL}
    ports:
      - "${APP_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data: