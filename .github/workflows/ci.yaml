name: CI Pipeline

on:
  push:
    branches:
      - main
      - develop
      - 'feature/**'
      - 'feat/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test-analyze-docker:
    name: Build, Test, Analyze and Package
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build application
        run: ./gradlew assemble --no-daemon

      - name: Check Docker
        run: |
          docker version
          docker info
          docker ps

      - name: Run tests
        run: ./gradlew test jacocoTestReport --no-daemon

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: test-results
          path: |
            build/reports/tests/test/
            build/reports/jacoco/test/
          if-no-files-found: ignore
          retention-days: 7

      - name: Build Docker image with Compose
        if: success()
        env:
          ORDER_SERVICE_DB_NAME: ${{ vars.ORDER_SERVICE_DB_NAME }}
          ORDER_SERVICE_DB_USER: ${{ vars.ORDER_SERVICE_DB_USER }}
          ORDER_SERVICE_DB_PORT: ${{ vars.ORDER_SERVICE_DB_PORT }}
          ORDER_SERVICE_PORT: ${{ vars.ORDER_SERVICE_PORT }}
          ORDER_SERVICE_DB_PASSWORD: ${{ secrets.ORDER_SERVICE_DB_PASSWORD }}
          IMAGE_TAG: ${{ github.sha }}
        run: docker compose build order-service

      - name: Save Docker image
        if: success()
        run: docker save order-service:${GITHUB_SHA} -o order-service.tar

      - name: Upload Docker image artifact
        if: success()
        uses: actions/upload-artifact@v6
        with:
          name: order-service-docker-image
          path: order-service.tar
          retention-days: 7